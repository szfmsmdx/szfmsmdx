name: Update profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-light&color_snake=#6553c4
            profile/snake-dark.svg?palette=github-dark&color_snake=#a998ff

      - name: Check the contribution animations
        run: |
          for svg in profile/snake{,-dark}.svg; do
            grep -q '@keyframes' "$svg" || { echo "::error::$svg is missing animation"; exit 1; }
          done

      - name: Refresh the saved rank cards
        run: |
          fetch_card() {
            curl --fail --silent --show-error --max-time 25 --get \
              --data-urlencode "username=$GITHUB_REPOSITORY_OWNER" \
              --data-urlencode "theme=$1" \
              --data "show_icons=true&hide_border=true" \
              --output "$RUNNER_TEMP/$2" \
              'https://github-readme-stats.vercel.app/api' &&
              grep -q 'data-testid="rank-circle"' "$RUNNER_TEMP/$2"
          }
          if fetch_card default stats.svg && fetch_card github_dark stats-dark.svg; then
            mv "$RUNNER_TEMP"/stats{,-dark}.svg profile/
          else
            echo "::warning::Rank service unavailable; refreshing the snake and retaining the last saved rank cards."
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: profile-graphics
          path: profile/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: profile-graphics
          path: profile/

      - name: Publish updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile/snake{,-dark}.svg profile/stats{,-dark}.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update profile graphics"
          git push
